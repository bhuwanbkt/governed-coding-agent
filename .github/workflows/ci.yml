name: CI

on:
  pull_request:
  workflow_call:   # reused by deploy.yml so production never skips the checks

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy

  test:
    name: Tests (unit + integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
          POSTGRES_DB: agent_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agent -d agent_test"
          --health-interval 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://agent:agent@localhost:5432/agent_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --locked
      - name: Migrations apply cleanly
        run: uv run alembic upgrade head
        env: { DATABASE_URL: "${{ env.TEST_DATABASE_URL }}" }
      - name: Migrations roll back and re-apply
        run: uv run alembic downgrade base && uv run alembic upgrade head
        env: { DATABASE_URL: "${{ env.TEST_DATABASE_URL }}" }
      - run: uv run pytest --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: coverage, path: coverage.xml }
      # Phase 6 adds the evaluation gate here (5 golden tasks, fails below threshold).

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }   # gitleaks scans history
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - name: Dependency vulnerabilities (pip-audit)
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt > /tmp/requirements.txt
          # Exported requirements are pinned with hashes, so pip-audit can skip resolution.
          uvx pip-audit --strict --disable-pip --requirement /tmp/requirements.txt --ignore-vuln PYSEC-2026-3740  # see docs/security-exceptions.md
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'   # deploy.yml builds the real image
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
