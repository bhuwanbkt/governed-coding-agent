[project]
name = "governed-coding-agent"
version = "0.1.0"
description = "Governed multi-agent coding agent: plans, writes, tests and reviews code, then opens a PR after human approval."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Bhuwan Raj Bokati" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "httpx>=0.27",
    "jinja2>=3.1",
    "mcp>=2.2,<3",
    "langchain-core>=0.3",
    "langchain-groq>=0.3",
    "langgraph>=0.4",
    # retrieval (phase 3): code-aware chunking, BM25, optional local embeddings
    "llama-index-core>=0.12",
    "llama-index-retrievers-bm25>=0.5",
    "llama-index-embeddings-fastembed>=0.3",
    "tree-sitter-language-pack>=0.7",  # grammars for LlamaIndex's CodeSplitter
    # governance (phase 4)
    "pyyaml>=6.0",  # policy file
    "pyjwt[crypto]>=2.9",  # GitHub App authentication (RS256)
    # web UI (phase 5)
    "itsdangerous>=2.2",  # signed session cookie (Starlette SessionMiddleware)
    "python-multipart>=0.0.20",  # HTML form posts
    # observability (phase 6)
    "langfuse>=5.0,<6",  # tracing; optional at runtime (off without keys)
    "pytest>=8.3",  # the agent runs target repositories' tests in production too
]

[project.scripts]
coding-agent = "coding_agent.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.13",  # Starlette's TestClient now uses httpx2
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "testcontainers[postgres]>=4.15",  # throwaway Postgres for integration tests
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coding_agent"]

# --------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "PTH", "N"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"migrations/**" = ["E501", "S608"]  # hand-written DDL built from constants
"evals/**" = ["I001", "S"]  # fixture repos and hidden tests: their own packages, not ours

# --------------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["coding_agent"]

[[tool.mypy.overrides]]
# Third-party packages without type information
module = ["llama_index.*", "fastembed.*", "tree_sitter_language_pack.*", "bm25s.*", "yaml.*"]
ignore_missing_imports = true

# --------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs a real Postgres (DATABASE_URL); skipped otherwise",
]

[tool.coverage.run]
source = ["coding_agent"]
branch = true
