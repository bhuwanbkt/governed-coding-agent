# Release: when a version tag is pushed, tag the already-deployed image with the version (no
# rebuild: the image that passed CI and the production smoke test is the release) and publish the
# GitHub Release from docs/releases/<tag>.md. Copy to .github/workflows/release.yml.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write    # create the GitHub Release
  packages: write    # add the version tag to the image in GHCR

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Image name (GHCR requires lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the deployed image with the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # The deploy workflow pushed this commit's image as :<sha>. Fail if it never did
          # (e.g. the tag isn't on a commit that was deployed from main).
          docker buildx imagetools inspect "$IMAGE:$GITHUB_SHA" > /dev/null
          docker buildx imagetools create --tag "$IMAGE:$TAG" "$IMAGE:$GITHUB_SHA"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          notes="docs/releases/$TAG.md"
          test -f "$notes" || { echo "missing $notes"; exit 1; }
          gh release create "$TAG" --title "$TAG" --notes-file "$notes" --verify-tag
